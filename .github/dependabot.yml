version: 2
updates:
  # Dépendances npm — groupées en une seule PR hebdomadaire pour les mises à
  # jour mineures/correctifs, afin de ne pas noyer l'équipe sous les PR.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types:
          - 'minor'
          - 'patch'

  # Actions GitHub utilisées par .github/workflows/ci.yml
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
